name: generate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: "Update gems"
        run: |
          bundle update mn2pdf

      - name: Setup Metanorma with oiml flavor
        uses: actions-mn/setup@v3
        with:
          installation-method: gem
          # extra-flavors: oiml
          github-packages-token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

      - name: Install private Fontist fonts
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
        run: |
          bundle exec fontist repo setup metanorma "https://${GH_TOKEN}@github.com/metanorma/fontist-formulas-private"
          bundle exec fontist repo update metanorma
          bundle exec fontist install "Futura PT Book"
          bundle exec fontist install "Futura PT Demi"
          bundle exec fontist install "Futura PT Light"

      - name: Metanorma generate site
        uses: actions-mn/build-and-publish@v2
        with:
          agree-to-terms: true
          destination: artifact
          artifact-name: mn

  generate-matrix:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fl-build matrix
        id: matrix
        run: |
          MATRIX=$(ruby .github/workflows/scripts/generate-fl-matrix.rb metanorma.yml)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  fl-build:
    needs: [build, generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: Firelight build - ${{ matrix.name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create git repo for Firelight
        run: |
          git config --global user.email "ci@metanorma.org"
          git config --global user.name "Metanorma CI"
          git config --global init.defaultBranch main
          rm -rf .git
          git init .
          git add "${{ matrix.dir }}/${{ matrix.xml }}"
          git commit -m "Add presentation XML for ${{ matrix.name }}"

      - name: Create anafero config
        env:
          ENTRYPOINT: ${{ matrix.dir }}/${{ matrix.xml }}
        run: |
          cat > anafero-config.json <<EOF
          {
            "version": "0.1",
            "entryPoint": "file:${ENTRYPOINT}",
            "storeAdapters": [
              "git+https://github.com/metanorma/firelight#fix-todom-array-format/packages/metanorma-xml-store"
            ],
            "contentAdapters": [
              "git+https://github.com/metanorma/firelight#fix-todom-array-format/packages/metanorma-site-content"
            ],
            "resourceLayouts": [
              "git+https://github.com/metanorma/firelight#fix-todom-array-format/packages/plateau-layout"
            ]
          }
          EOF
          git add anafero-config.json
          git commit -m "Add anafero config for ${{ matrix.name }}"

      - name: Firelight generate HTML for ${{ matrix.name }}
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: |
          npx --node-options='--experimental-vm-modules --max_old_space_size=6144' \
            -y @riboseinc/anafero-cli@0.0.70 build-site \
            --target-dir dist/${{ matrix.url }} \
            --path-prefix /mn-samples-oiml/documents/${{ matrix.url }}/firelight \
            --current-rev main

      - uses: actions/upload-artifact@v4
        with:
          name: fl-${{ matrix.name }}
          path: dist

  build-site:
    runs-on: ubuntu-latest
    needs: fl-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: mn
          path: site

      - name: Download Firelight artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fl-*
          path: fl

      - name: Merge Firelight HTML into site
        run: bundle exec ruby .github/workflows/scripts/merge-firelight.rb site fl dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
