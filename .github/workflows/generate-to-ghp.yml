name: generate-and-deploy-to-ghp

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Metanorma assets
        uses: actions-mn/cache@v1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Update Fontist
        run: bundle exec fontist update

      - name: Install private Fontist fonts
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
        run: |
          bundle exec fontist repo setup metanorma "https://${GH_TOKEN}@github.com/metanorma/fontist-formulas-private"
          bundle exec fontist repo update metanorma
          bundle exec fontist install "Futura PT Book"
          bundle exec fontist install "Futura PT Demi"
          bundle exec fontist install "Futura PT Light"

      - name: Print Metanorma version
        run: bundle exec metanorma --version

      - name: Build documents (non-collections) and cache
        uses: actions-mn/build-and-publish@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          agree-to-terms: true
          destination: artifact
          artifact-name: mn
          use-bundler: true
          cache-site-for-manifest: metanorma.yml
          cache-extra-input: |
            sources/**

  build-collections:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection:
          - { name: 'r060', dir: 'sources/r060' }
          - { name: 'r138-e07', dir: 'sources/r138-e07' }
    name: Build collection ${{ matrix.collection.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Update Fontist
        run: bundle exec fontist update

      - name: Install private Fontist fonts
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
        run: |
          bundle exec fontist repo setup metanorma "https://${GH_TOKEN}@github.com/metanorma/fontist-formulas-private"
          bundle exec fontist repo update metanorma
          bundle exec fontist install "Futura PT Book"
          bundle exec fontist install "Futura PT Demi"
          bundle exec fontist install "Futura PT Light"

      - name: Build collection ${{ matrix.collection.name }}
        run: |
          bundle exec metanorma collection "${{ matrix.collection.dir }}/collection.yml" --agree-to-terms

      - name: Move collection output
        run: |
          # Collection outputs go to sources/<collection>/collection-output/; move to documents/<collection>/ for fl-build
          mkdir -p documents
          mv "${{ matrix.collection.dir }}/collection-output" "documents/${{ matrix.collection.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mn-${{ matrix.collection.name }}
          path: documents/${{ matrix.collection.name }}/

  fl-build:
    runs-on: ubuntu-latest
    needs: [build-documents, build-collections]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Individual documents (from build-documents artifact, path: documents/{name}/)
          - name: 'b022-e23'
            artifact: 'mn'
            dir: 'documents/b022-e23'
            xml: 'document.presentation.xml'
            url: 'b022-e23'
            prefix: '/mn-samples-oiml/'
          - name: 'd036-e20'
            artifact: 'mn'
            dir: 'documents/d036-e20'
            xml: 'document.presentation.xml'
            url: 'd036-e20'
            prefix: '/mn-samples-oiml/'
          - name: 'e006-e11'
            artifact: 'mn'
            dir: 'documents/e006-e11'
            xml: 'document.presentation.xml'
            url: 'e006-e11'
            prefix: '/mn-samples-oiml/'
          - name: 'g021-e17'
            artifact: 'mn'
            dir: 'documents/g021-e17'
            xml: 'document.presentation.xml'
            url: 'g021-e17'
            prefix: '/mn-samples-oiml/'
          - name: 'r007-e79'
            artifact: 'mn'
            dir: 'documents/r007-e79'
            xml: 'document.presentation.xml'
            url: 'r007-e79'
            prefix: '/mn-samples-oiml/'
          - name: 'r144-1'
            artifact: 'mn'
            dir: 'documents/r144/1'
            xml: 'document.presentation.xml'
            url: 'r144-1'
            prefix: '/mn-samples-oiml/'
          - name: 'r144-2'
            artifact: 'mn'
            dir: 'documents/r144/2'
            xml: 'document.presentation.xml'
            url: 'r144-2'
            prefix: '/mn-samples-oiml/'
          - name: 'r144-3'
            artifact: 'mn'
            dir: 'documents/r144/3'
            xml: 'document.presentation.xml'
            url: 'r144-3'
            prefix: '/mn-samples-oiml/'
          # Collections (from build-collections artifacts, files at artifact root)
          - name: 'r060'
            artifact: 'mn-r060'
            dir: ''
            xml: 'collection.presentation.xml'
            url: 'r060'
            prefix: '/mn-samples-oiml/'
          - name: 'r138-e07'
            artifact: 'mn-r138-e07'
            dir: ''
            xml: 'collection.presentation.xml'
            url: 'r138-e07'
            prefix: '/mn-samples-oiml/'
    name: Firelight build - ${{ matrix.name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .

      - name: Create git repo for Firelight
        run: |
          git config --global user.email "ci@metanorma.org"
          git config --global user.name "Metanorma CI"
          git config --global init.defaultBranch main
          rm -rf .git
          git init .
          if [ -n "${{ matrix.dir }}" ]; then
            git add "${{ matrix.dir }}/${{ matrix.xml }}"
          else
            git add "${{ matrix.xml }}"
          fi
          git commit -m "Add presentation XML for ${{ matrix.name }}"

      - name: Create anafero config
        env:
          ENTRYPATH: ${{ matrix.dir != '' && format('{0}/{1}', matrix.dir, matrix.xml) || matrix.xml }}
        run: |
          cat <<'EOF' > anafero-config.json
          {
            "version": "0.1",
            "entryPoint": "file:${ENTRYPATH}",
            "storeAdapters": [
              "git+https://github.com/metanorma/firelight#main/packages/metanorma-xml-store"
            ],
            "contentAdapters": [
              "git+https://github.com/metanorma/firelight#main/packages/metanorma-site-content"
            ],
            "resourceLayouts": [
              "git+https://github.com/metanorma/firelight#main/packages/plateau-layout"
            ]
          }
          EOF
          git add anafero-config.json
          git commit -m "Add anafero config for ${{ matrix.name }}"

      - name: Firelight generate HTML for ${{ matrix.name }}
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: |
          npx --node-options='--experimental-vm-modules --max_old_space_size=6144' \
            -y @riboseinc/anafero-cli@0.0.70 build-site \
            --target-dir dist/${{ matrix.url }} \
            --path-prefix ${{ matrix.prefix }}${{ matrix.url }} \
            --current-rev main

      - uses: actions/upload-artifact@v4
        with:
          name: fl-${{ matrix.name }}
          path: dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: fl-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Make dist dir
        run: mkdir dist

      - name: Download HTML artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fl-*
          path: dist
          merge-multiple: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create index page
        run: ruby .github/workflows/scripts/generate-index.rb

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
